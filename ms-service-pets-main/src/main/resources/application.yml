server:
  port: 8081

spring:
  application:
    name: service-pets
  datasource:
    url: jdbc:postgresql://localhost:5432/petshop
    username: postgre
    password: 5555
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
